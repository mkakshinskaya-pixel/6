<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сложный пример CSS Grid</title>
<style>
 body {
 display: flex;
 align-items: center;
 justify-content: center;
 min-height: 100vh;
 margin: 0;
 font-family: Arial, sans-serif;
 background-color: #f5f5f5;
 }
 /* Контейнер сетки */
 .grid-container {
 display: grid;
 gap: 10px;
 grid-template-columns: 1fr 1fr 1fr;

 width: 100%;
 max-width: 1200px;
 }
 /* Цветные элементы сетки с именованными областями */

.item1 { grid-row: 1;
         grid-column:1 ; 
         border-radius: 10px;
         height: 90px;
         background-color: #A1E8AF; }
.item2 { border-radius: 10px; 
         height: 90px;
         grid-row: 1;
         grid-column: 2;
         background-color: #FFE156; }
.item3 {
         grid-column: 1/3;
         border-radius: 10px;
         height: 90px;
        
         background-color: #FF9F1C; }
 .item4 { grid-column: 1;
          grid-row: 3; 
          min-height: 250px;
          border-radius: 10px; 
          width: 70%;
          justify-self: start;
          background-color: #FFB6B9; }
 .item5 { grid-column: 3; 
          grid-row: 4; 
          border-radius: 10px; 
          height: 40px;
          width: 60%;
          justify-self: end;
          background-color: #4D96FF; }

 /* Оформление элементов сетки */
 .grid-item {
 display: flex;
 align-items: center;
 justify-content: center;
 color: white;
 font-size: 1.5em;
 font-weight: bold;
 border-radius: 8px;
 padding: 20px;
 }
</style>
</head>
<body>
<div class="grid-container">

 <div class="grid-item item1">Широкий блок</div>
 <div class="grid-item item2">Во всю ширину</div>
  <div class="grid-item item3">Нижний блок</div>
 <div class="grid-item item4">Большой блок</div>
 <div class="grid-item item5">Футер</div>
 

</div>
</body>
</html>
